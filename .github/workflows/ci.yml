name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: go vet
        run: go vet ./...

      # 30 min por pacote, e não os 10 do padrão: no runner Windows o fsync do
      # SQLite chega a parar minutos (em 11-out-2026 um commit ficou 4 min no
      # FlushFileBuffers), e o cmd/agent já levava 467 s numa rodada boa. Um
      # teste travado de verdade continua caindo, só que mais tarde.
      - name: go test
        run: go test -timeout 30m ./...

      # O servidor de teste (login de teste, conta de id fixo) só existe com a
      # build tag logindeteste; sem este passo, os testes dele nunca rodam no CI.
      - name: go test (servidor de teste)
        run: go test -tags logindeteste ./cmd/server/... ./internal/server/...

      - name: go build
        run: go build ./...

  # O detector de corrida precisa de cgo, e o PC de desenvolvimento não tem
  # compilador C: é aqui que ele roda. Com um Postgres descartável, para os
  # testes *_pg_test.go (o sync concorrente, o login, o apagar), que no job de
  # cima pulam por falta do AURORA_TEST_POSTGRES_URL. O Postgres é o mesmo do
  # deploy/compose.yml, tag e digest (deploy/digests_test.go confere que batem).
  # Sem senha (trust): o contêiner só existe durante o job e só o runner o
  # alcança.
  race:
    name: go -race (ubuntu, com Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AURORA_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: go test -race
        run: go test -race -timeout 30m ./...

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Precisa acompanhar o pnpm que gerou o web/pnpm-lock.yaml (11.5.1).
          # Com pnpm 10 lendo um lockfile v11, o --frozen-lockfile abaixo quebra.
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Nao usamos a gitleaks-action: ela deriva um intervalo de commits do
      # evento de push (before..after) e quebra quando o "before" nao existe
      # — caso do primeiro push de um repo, de force-push e de rebase. Pior,
      # nesses casos ela escaneia zero byte e mesmo assim parece ter rodado.
      # Instalar o binario e escanear o historico inteiro e deterministico e
      # independente do formato do evento.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      # go install valida o download contra a checksum database do Go
      # (sum.golang.org), entao a versao fixada aqui e verificada
      # criptograficamente — sem curl para shell.
      #
      # ATENCAO ao caminho: o projeto migrou para github.com/gitleaks/gitleaks
      # no GitHub, mas o go.mod dele ainda declara o modulo como
      # zricethezav/gitleaks/v8. Usar o caminho novo falha com
      # "module declares its path as". Nao "corrija" isto.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3

      - name: Scan full git history for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1
